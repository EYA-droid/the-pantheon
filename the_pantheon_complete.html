<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Pantheon</title><style>
:root{--bg:#050403;--p:#120d08;--g:#c9a66b;--t:#eee5d7;--m:#a59b8e;--l:#c9a66b44}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% 0,#24180d,#050403 38%);color:var(--t);font-family:Georgia,serif;line-height:1.7}nav{position:fixed;top:0;left:0;right:0;z-index:5;background:#050403ed;border-bottom:1px solid var(--l);backdrop-filter:blur(14px)}.nav{max-width:1400px;margin:auto;padding:15px 22px;display:flex;gap:25px;align-items:center}.brand{color:#e2c48d;text-decoration:none;letter-spacing:4px;font:13px Arial}.links{display:flex;gap:16px;overflow:auto}.links button,.back{background:none;border:1px solid transparent;color:#aaa195;cursor:pointer;font:10px Arial;letter-spacing:1.7px;padding:8px}.links button:hover,.back{color:var(--g)}header{min-height:100vh;display:grid;place-items:center;text-align:center;padding:110px 25px}.eyebrow,.tag{color:var(--g);font:10px Arial;letter-spacing:5px;text-transform:uppercase}.hero h1{font-size:clamp(65px,13vw,155px);line-height:.8;letter-spacing:9px;margin:28px 0}.rule{height:1px;background:var(--g);width:180px;margin:35px auto}.lead{font-size:21px;color:var(--m);max-width:700px;margin:auto}.section,.detail{max-width:1200px;margin:auto;padding:90px 25px}.title{font-size:clamp(44px,7vw,78px);margin:8px 0 20px}.intro{color:var(--m);font-size:18px;max-width:780px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:35px}.card{background:linear-gradient(145deg,#181109,#0b0806);border:1px solid var(--l);padding:28px;min-height:200px;cursor:pointer;transition:.25s}.card:hover{transform:translateY(-6px);border-color:#c9a66b99;box-shadow:0 18px 50px #000}.icon{font-size:34px;color:#e2c48d}.card h3{font-size:29px;margin:10px 0 5px}.card p{margin:0;color:var(--m)}.detail{min-height:100vh;padding-top:120px}.detail h1{font-size:clamp(55px,10vw,110px);line-height:.9;margin:10px 0 20px}.detail .lead{margin:0;max-width:850px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:40px}.panel{background:linear-gradient(145deg,#17110b,#090705);border:1px solid var(--l);padding:32px}.panel h2{color:#e2c48d}.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fact{background:#090705;border:1px solid #c9a66b2b;padding:18px}.fact b{display:block;color:var(--g);font:10px Arial;letter-spacing:2px;margin-bottom:5px}.quote{text-align:center;font-size:28px;font-style:italic;color:#c9b99f;padding:70px 20px;border-block:1px solid var(--l);margin-top:45px}.search{margin-top:25px;width:min(600px,100%);padding:15px;background:#090705;border:1px solid var(--l);color:white;outline:0}.tree{text-align:center}.node{display:inline-block;background:#15100b;border:1px solid var(--g);padding:12px 18px;margin:6px;color:#e2c48d}.arrow{color:#806a48;font-size:24px}footer{text-align:center;padding:65px;border-top:1px solid var(--l);color:#625b52;font:10px Arial;letter-spacing:3px}@media(max-width:850px){.cards,.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.cards,.grid,.facts{grid-template-columns:1fr}.links{gap:5px}.hero h1{letter-spacing:5px}}
</style></head><body><nav><div class="nav"><a class="brand" href="#" onclick="home();return false">THE PANTHEON</a><div class="links"><button onclick="cat('gods')">GODS</button><button onclick="cat('heroes')">HEROES</button><button onclick="cat('monsters')">MONSTERS</button><button onclick="cat('myths')">MYTHS</button><button onclick="cat('underworld')">UNDERWORLD</button><button onclick="tree()">FAMILY TREE</button></div></div></nav><main id="app"></main><footer>THE PANTHEON · AN ATLAS OF GREEK MYTHOLOGY</footer><script>
const D={gods:[['⚡','Zeus','King of the gods','Son of Cronus and Rhea; ruler of Olympus and god of sky and thunder.','Hera','Thunderbolt'],['👑','Hera','Queen of Olympus','Goddess of marriage and queen of the Olympians.','Zeus','Peacock'],['🌊','Poseidon','Lord of the Sea','Brother of Zeus and ruler of the seas, earthquakes and horses.','Amphitrite','Trident'],['🦉','Athena','Goddess of Wisdom','Daughter of Zeus, associated with wisdom, strategy and crafts.','Zeus','Owl'],['⚔️','Ares','God of War','Olympian god associated with the violent side of warfare.','Zeus & Hera','Spear'],['🌹','Aphrodite','Goddess of Love','Goddess associated with love, beauty and desire.','Hephaestus','Dove'],['☀️','Apollo','God of Light','God associated with music, prophecy, healing and the arts.','Zeus & Leto','Lyre'],['🌙','Artemis','Goddess of the Hunt','Twin of Apollo and goddess of hunting and wilderness.','Zeus & Leto','Bow'],['🪽','Hermes','Messenger of the Gods','Swift messenger, traveller and guide of souls.','Zeus & Maia','Winged sandals'],['🔥','Hephaestus','God of the Forge','Divine smith and master craftsman of the gods.','Hera','Hammer'],['🌾','Demeter','Goddess of Harvest','Goddess of agriculture and grain, central to the Persephone myth.','Cronus & Rhea','Wheat'],['🍇','Dionysus','God of Wine','God of wine, theatre, celebration and transformation.','Zeus & Semele','Vine'],['🔥','Hestia','Goddess of the Hearth','Goddess of the sacred hearth, home and family.','Cronus & Rhea','Flame']],heroes:[['🦁','Heracles','The strongest hero','Son of Zeus and Alcmene, famous for his Twelve Labours.','Zeus & Alcmene','Lion skin'],['🛡️','Perseus','Slayer of Medusa','Hero who defeated Medusa and rescued Andromeda.','Zeus & Danaë','Reflective shield'],['⚔️','Achilles','Warrior of Troy','Legendary warrior central to the Trojan War tradition.','Peleus & Thetis','Spear'],['🌊','Odysseus','King of Ithaca','Clever hero whose journey home became the Odyssey.','Laertes & Anticlea','Ship'],['🐂','Theseus','Hero of Athens','Athenian hero famous for defeating the Minotaur.','Aegeus & Aethra','Sword'],['⚓','Jason','Leader of the Argonauts','Hero who sailed with the Argonauts for the Golden Fleece.','Aeson & Polymede','Argo'],['🏹','Atalanta','Swift-footed huntress','Heroine famous for hunting, speed and the golden-apple race.','Iasus','Golden apples'],['🎵','Orpheus','Legendary musician','Musician who journeyed into the Underworld for Eurydice.','Oeagrus & Calliope','Lyre'],['🐎','Bellerophon','Rider of Pegasus','Hero who rode Pegasus and defeated the Chimera.','Glaucus','Pegasus']],monsters:[['🐍','Medusa','The Gorgon','Gorgon whose gaze was said to turn people to stone.','Perseus','Snakes'],['🐂','Minotaur','Monster of the Labyrinth','Creature with a bull head associated with the Cretan Labyrinth.','Minos','Bull'],['🐍','Hydra','Serpent of Lerna','Many-headed serpent defeated by Heracles.','Typhon & Echidna','Serpent'],['🐕','Cerberus','Hound of Hades','Mythical hound guarding the Underworld.','Typhon & Echidna','Three heads'],['🦁','Chimera','Fire-breathing beast','Hybrid monster associated with lion, goat and serpent.','Typhon & Echidna','Fire'],['🦅','Sphinx','Riddle-giver','Creature famous for presenting a deadly riddle near Thebes.','Echidna & Typhon','Riddle'],['🌊','Scylla','Sea Monster','Terrifying creature encountered by sailors in Greek myth.','Sea tradition','Rocky coast'],['👁️','Cyclops','One-eyed giants','Powerful one-eyed beings including Polyphemus.','Various','Single eye']],myths:[['🌌','Creation of the Cosmos','The beginning','Greek creation traditions begin with primordial forces such as Chaos and Gaia.','Primordial gods','Cosmos'],['🔥','Prometheus','Fire for humanity','Prometheus became famous for giving fire to humanity.','Prometheus','Fire'],['📦','Pandora','The first woman','Story explaining how troubles entered the human world while hope remained.','Zeus','Jar'],['🌸','Persephone','The seasons','Persephone’s descent connects the Underworld with Demeter and seasonal change.','Demeter & Zeus','Pomegranate'],['🏛️','Trojan War','The war of Troy','Legendary conflict involving Greek heroes, Troy and divine intervention.','Many heroes','Wooden horse'],['🦁','Twelve Labours','Heracles’ trials','A sequence of extraordinary tasks imposed on Heracles.','Heracles','Club'],['⚓','Golden Fleece','The Argonauts','Jason and the Argonauts journeyed to Colchis seeking the Golden Fleece.','Jason','Golden fleece']],underworld:[['👑','Hades','Lord of the Dead','Ruler of the Underworld and brother of Zeus and Poseidon.','Cronus & Rhea','Bident'],['🌸','Persephone','Queen of the Underworld','Daughter of Demeter whose myth connects life with the realm below.','Zeus & Demeter','Pomegranate'],['🪙','Charon','Ferryman of the Dead','Mythical ferryman who carries souls across the waters of the dead.','Underworld tradition','Coin'],['🐕','Cerberus','Guardian of Hades','Hound associated with guarding the entrance to Hades.','Typhon & Echidna','Three heads'],['🔥','Tartarus','Deepest abyss','Deep cosmic region associated with imprisonment and punishment.','Primordial','Abyss'],['🌿','Elysium','Blessed realm','Paradise-like region of the afterlife in later Greek traditions.','Underworld','Fields']]};
const names={gods:'Meet the Olympians and divine powers who shaped the Greek cosmos.',heroes:'Discover legendary warriors and adventurers whose stories became immortal.',monsters:'Encounter the creatures and beasts that haunted the heroic world.',myths:'Explore stories of creation, sacrifice, love, war and destiny.',underworld:'Descend into the realm ruled by Hades and explore the afterlife.'};
function home(){app.innerHTML=`<header><div class="hero"><div class="eyebrow">AN ATLAS OF ANCIENT GREECE</div><h1>THE PANTHEON</h1><div class="rule"></div><p class="lead">Enter a dark museum of gods, heroes, monsters, myths and the Underworld.</p><input class="search" placeholder="Search the Pantheon..." oninput="search(this.value)"></div></header><section class="section"><div class="eyebrow">EXPLORE</div><h2 class="title">The Ancient World</h2><p class="intro">Choose a collection. Every card opens a full museum-style entry with facts and connections.</p><div class="cards">${[['⚡','GODS','Olympians and divine powers','gods'],['🛡️','HEROES','Mortals who became legends','heroes'],['🐍','MONSTERS','Beasts of myth','monsters'],['📜','MYTHS','Stories of the ancient world','myths'],['🜏','UNDERWORLD','Hades and the realms below','underworld'],['🌳','FAMILY TREE','See the divine generations','tree']].map(x=>`<div class="card" onclick="${x[3]=='tree'?'tree()':`cat('${x[3]}')`}"><div class="icon">${x[0]}</div><div class="tag">Collection</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div></section>`;scrollTo(0,0)}
function cat(t){app.innerHTML=`<section class="section"><button class="back" onclick="home()">← HOME</button><div class="eyebrow">COLLECTION</div><h1 class="title">${t.toUpperCase()}</h1><p class="intro">${names[t]}</p><div class="cards">${D[t].map((x,i)=>`<div class="card" onclick="detail('${t}',${i})"><div class="icon">${x[0]}</div><div class="tag">${x[2]}</div><h3>${x[1]}</h3><p>${x[3]}</p></div>`).join('')}</div></section>`;scrollTo(0,0)}
function detail(t,i){let x=D[t][i];app.innerHTML=`<section class="detail"><button class="back" onclick="cat('${t}')">← BACK TO ${t.toUpperCase()}</button><div class="eyebrow">${t.toUpperCase()} · ${x[2]}</div><h1>${x[1]}</h1><p class="lead">${x[3]}</p><div class="grid"><div class="panel"><h2>The Story</h2><p>${story(x[1])}</p></div><div class="panel"><h2>Key Facts</h2><div class="facts"><div class="fact"><b>FAMILY / CONNECTION</b>${x[4]}</div><div class="fact"><b>SYMBOL</b>${x[5]}</div><div class="fact"><b>COLLECTION</b>${t.toUpperCase()}</div><div class="fact"><b>STATUS</b>Legendary figure</div></div></div></div><div class="quote">The myths remain because every generation finds something ancient in itself.</div></section>`;scrollTo(0,0)}
function story(n){let s={Zeus:'Ruler of Olympus, Zeus appears throughout Greek mythology as a powerful divine authority associated with the sky, thunder, law and hospitality.',Athena:'Athena represents intelligence, strategy, disciplined courage and craftsmanship. Athens adopted her as its patron goddess.',Poseidon:'Poseidon rules the sea and is also associated with earthquakes and horses. Sailors respected his power and feared his storms.',Heracles:'Heracles’ adventures became a model of heroic endurance. His Twelve Labours brought him against monsters and seemingly impossible tasks.',Perseus:'Perseus combined divine assistance, courage and cleverness to defeat Medusa and rescue Andromeda.',Achilles:'Achilles stands at the centre of the Iliad’s exploration of anger, honour, friendship, glory and mortality.',Odysseus:'Odysseus is celebrated for cunning as much as courage. His long return to Ithaca tests identity, loyalty and endurance.',Medusa:'Medusa became one of the most recognisable monsters of Greek mythology. Her image also served as a protective symbol.',Minotaur:'The Minotaur is tied to Crete, the Labyrinth and Theseus, forming one of mythology’s most famous monster-and-hero encounters.',Hades:'Hades is the stern ruler of the realm of the dead, maintaining the boundary between mortal life and the afterlife.',Persephone:'Persephone’s dual role as daughter of Demeter and queen of the Underworld makes her central to myths of seasonal change.'};return s[n]||`${n} occupies an important place in Greek mythological tradition. Ancient stories were retold across generations, with details changing between poets and periods.`}
function search(q){q=q.toLowerCase();let r=[];Object.keys(D).forEach(t=>D[t].forEach((x,i)=>{if(x.join(' ').toLowerCase().includes(q)&&q)r.push([t,i,x])}));app.innerHTML=`<section class="section"><button class="back" onclick="home()">← HOME</button><div class="eyebrow">SEARCH</div><h1 class="title">Results</h1><div class="cards">${r.length?r.map(z=>`<div class="card" onclick="detail('${z[0]}',${z[1]})"><div class="icon">${z[2][0]}</div><div class="tag">${z[2][2]}</div><h3>${z[2][1]}</h3><p>${z[2][3]}</p></div>`).join(''):'<p class="intro">No entries found.</p>'}</div></section>`}
function tree(){app.innerHTML=`<section class="section"><button class="back" onclick="home()">← HOME</button><div class="eyebrow">GENEALOGY</div><h1 class="title">DIVINE FAMILY TREE</h1><p class="intro">A simplified guide to the major generations of Greek divine genealogy.</p><div class="panel tree"><div class="node">CHAOS</div><div class="arrow">↓</div><div><span class="node">GAIA</span><span class="node">URANUS</span></div><div class="arrow">↓</div><div class="node">CRONUS + RHEA</div><div class="arrow">↓</div><div><span class="node">ZEUS</span><span class="node">HERA</span><span class="node">POSEIDON</span><span class="node">HADES</span><span class="node">DEMETER</span><span class="node">HESTIA</span></div><div class="arrow">↓</div><div><span class="node">ATHENA</span><span class="node">APOLLO</span><span class="node">ARTEMIS</span><span class="node">ARES</span><span class="node">HERMES</span><span class="node">DIONYSUS</span></div></div></section>`;scrollTo(0,0)}home();
</script></body></html>
